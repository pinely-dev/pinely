services:
  postgres:
    image: postgres:16-alpine
    container_name: pinely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinely
      POSTGRES_PASSWORD: pinely_local_dev
      POSTGRES_DB: pinely
      # Init order: the schemas are created before any service connects.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      # A new volume name on purpose: a database from another deployment must never be reused.
      - pinely-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinely -d pinely"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pinely-postgres-data:
