name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Init required submodules
        working-directory: .
        run: |
          git submodule update --init --checkout \
            contracts/lib/forge-std \
            contracts/lib/v4-core \
            contracts/lib/v4-periphery \
            contracts/lib/v4-hooks-public
          git -C contracts/lib/v4-core submodule update --init \
            lib/openzeppelin-contracts \
            lib/solmate
          git -C contracts/lib/v4-periphery submodule update --init \
            lib/permit2

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test (unit + fuzz + invariant)
        run: forge test -vvv

  app:
    name: Workspace (Node 22 + Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build web
        run: bun run build

      - name: Build backend
        run: bun run build:backend

      - name: Build indexer
        run: bun run build:indexer

      - name: Build sdk
        run: bun run build:sdk

      - name: Test SDK (TypeScript)
        run: bun run test:sdk

      - name: Test Backend
        run: bun run test:backend

  sdk-python:
    name: PINELY SDK (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk-python

      - name: Run Python SDK tests
        run: python -m unittest discover -s sdk-python/tests -t sdk-python
