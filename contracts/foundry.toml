[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# No solc_version pin: forge auto-detects it per file (src pragma 0.8.34,
# v4-core =0.8.26). A single pin breaks compilation of the Uniswap v4 dependencies.
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
via_ir = false

# All contract dependencies are Foundry submodules under lib/.
# v4-hooks-public provides BaseHook (recent v4-periphery no longer includes it).
remappings = [
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "v4-periphery/=lib/v4-periphery/",
  "v4-hooks-public/=lib/v4-hooks-public/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "openzeppelin-contracts/=lib/v4-core/lib/openzeppelin-contracts/",
  "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "solmate/=lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
]

# Foundry broadcasts are written to broadcast/<Script>.s.sol/<chainId>/ and must be committed.
# out/ and cache/ are not committed.

[rpc_endpoints]
# Robinhood Chain. A public RPC exists for each network, but use a provider endpoint in production (and an archive
# endpoint for backfills). Set RPC_URL_ROBINHOOD_TESTNET and RPC_URL_ROBINHOOD_MAINNET.
robinhood_testnet = "${RPC_URL_ROBINHOOD_TESTNET}"
robinhood_mainnet = "${RPC_URL_ROBINHOOD_MAINNET}"

# [etherscan] is intentionally empty. The Robinhood Chain explorers are Blockscout; add the verifier URL here
# once it is confirmed from the official Robinhood Chain documentation (do not guess it), then use
# `--verify --verifier blockscout`.

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
